[project]
name = "prediction-gravite-accidents"
version = "0.1.0"
description = "Prédiction de la gravité des accidents de la route (BAAC) avec API FastAPI et UI Streamlit."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.23",
  "streamlit>=1.30",
  "requests>=2.31",
  "pandas>=2.0",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "bandit",
    "safety",
    "httpx",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "lightgbm", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --cov=backend --cov-report=term-missing"

