[project]
name = "prediction-gravite-accidents"
version = "0.1.0"
description = "Prédiction de la gravité des accidents de la route (BAAC) avec API FastAPI et UI Streamlit."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.23",
  "streamlit>=1.30",
  "requests>=2.31",
  "pandas>=2.0",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "bandit",
    "safety",
    "httpx",
]
