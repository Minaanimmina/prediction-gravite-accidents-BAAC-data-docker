[project]
name = "prediction-gravite-accidents"
version = "0.1.0"
description = "Prédiction de la gravité des accidents de la route (BAAC) avec API FastAPI et UI Streamlit."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.23",
  "streamlit>=1.30",
  "requests>=2.31",
  "pandas>=2.0",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "python-dotenv"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "bandit",
    "safety",
    "httpx",
    "pre-commit",
    "python-semantic-release"
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "lightgbm", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.*"]
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --cov=backend --cov-report=term-missing"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "master"
commit_message = "chore(release): v{version}"
build_command = ""

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.changelog]
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true
