[project]
name = "prediction-gravite-accidents"
version = "0.1.0"
description = "Prédiction de la gravité des accidents de la route (BAAC) avec API FastAPI et UI Streamlit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.100",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.23",
  "streamlit>=1.30",
  "requests>=2.31",
  "pandas>=2.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "missingno>=0.5",
  "plotly>=5.0",
  "scikit-learn>=1.3",
  "shap>=0.41",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
]
