version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: minaanim/accidents-api:latest
    container_name: accidents-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: minaanim/accidents-app:latest
    container_name: accidents-app
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - API_URL=${API_URL:-http://api:8000}
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: accidents-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mina
      POSTGRES_DB: accidents_predictions
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
