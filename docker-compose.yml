version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: accidents-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - ./models:/models
      - ./data/processed:/data/processed
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: accidents-app
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      - API_URL=${API_URL:-http://api:8000}
    restart: unless-stopped