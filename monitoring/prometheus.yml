global:
  scrape_interval: 15s      # scrape toutes les 15 secondes
  evaluation_interval: 15s  # évalue les règles toutes les 15 secondes

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['api:8000']    # "api" = nom du service dans docker-compose
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
